# Runs as the unprivileged "nginx" user: port > 1024, pid and temp paths under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Privacy: never log the query string (search terms are fragments of quote text/usernames)
  # or client IP/referer/user agent. $uri has no query string; do not use $request/$args.
  log_format private '$time_iso8601 $request_method $uri $status $request_time';
  access_log /dev/stdout private;
  server_tokens off;
  client_max_body_size 1m;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://api:8787;
      proxy_set_header Host $http_host;
      # Overwrite, never append: the API rate limiter keys on this header (ADR 0007).
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      try_files $uri $uri/ $uri.html =404;
    }
  }
}

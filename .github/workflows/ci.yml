# Verifies every pull request and every push to main (issue #13).
# Checks only: no deploy step, no secrets, no Cloudflare credentials.
# Deploys are done by Cloudflare Workers Builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck API
        run: npm run typecheck -w api

      - name: Test API
        run: npm test -w api

      - name: Typecheck web
        run: npm run typecheck -w web

      - name: Test web
        run: npm test -w web

      - name: Build web
        run: npm run build -w web

      - name: Test scripts
        run: npm run test:scripts
